# Template de workflow (ADR-007) para a cadeia completa da feature 002
# (ADR-002): clona/prepara o workspace, implementa via Claude Code, abre PR,
# aguarda CI e revisa — mesmos `steps:` de `examples/implementar-historia-sdd.yaml`,
# agora também disparável pelo painel via `POST /runs/from-template` (preserva
# 100% o comportamento existente; `examples/implementar-historia-sdd.yaml`
# continua funcionando como estava, para quem dispara por `config_path` direto).
#
# `vars:` não é declarado aqui — é preenchido em runtime a partir dos `params`
# submetidos (ver application/workflow_templates.py::materialize_chain_raw).

id: implementar-historia-sdd
label: "Implementar história (SDD completo: código + PR + review)"
description: >-
  Clona/prepara o workspace, implementa a história via Claude Code, abre uma
  PR, aguarda os checks de CI e revisa a mudança — pipeline completo da
  feature 002.
params_schema:
  - name: repo_url
    label: "URL do repositório (git)"
    type: text
    required: true
  - name: historia_id
    label: "ID da história/documento de referência"
    type: text
    required: true
  - name: branch_name
    label: "Nome da branch"
    type: text
    required: true
  - name: branch_base
    label: "Branch base"
    type: text
    required: true
  - name: install_cmd
    label: "Comando de instalação de dependências (opcional)"
    type: text
    required: false
  - name: docker_compose_path
    label: "Caminho do docker-compose (opcional)"
    type: text
    required: false

name: implementar-historia-sdd
steps:
  - name: preparar_ambiente
    plugin: workspace_setup
    usa_output_anterior: false
    params:
      repo_url: "{{ vars.repo_url }}"
      branch_base: "{{ vars.branch_base }}"
      branch_name: "{{ vars.branch_name }}"
      historia_id: "{{ vars.historia_id }}"
      install_cmd: "{{ vars.install_cmd }}"
      docker_compose_path: "{{ vars.docker_compose_path }}"
    retry:
      max_attempts: 3
      initial_delay: 10.0
      multiplier: 2.0

  - name: implementar_historia
    plugin: claude_code_runner
    usa_output_anterior: true
    params:
      modo: "coding"
      mcp_config_path: "./config/mcp-docusaurus.json"
      historia_id: "{{ vars.historia_id }}"
    retry:
      max_attempts: 2
      initial_delay: 30.0
      multiplier: 2.0

  - name: abrir_pr
    plugin: git_pr
    usa_output_anterior: true
    params:
      action: "create_pr"
      branch: "{{ vars.branch_name }}"
      base_branch: "{{ vars.branch_base }}"
      historia_id: "{{ vars.historia_id }}"
      title_template: "[{{ vars.historia_id }}] {{ summary }}"
      body_template: |
        Implementa {{ vars.historia_id }}.

        Docs consultados durante a implementação:
        {{ docs_referenced }}
      labels: ["automated-pr"]
    retry:
      max_attempts: 3
      initial_delay: 15.0
      multiplier: 2.0

  - name: aguardar_checks
    plugin: shell_script_runner
    usa_output_anterior: true
    params:
      script_path: "./scripts/poll_ci_checks.sh"
      interpreter: "bash"
      timeout_seconds: 600
    retry:
      max_attempts: 5
      initial_delay: 60.0
      multiplier: 1.0

  - name: revisar_pr
    plugin: claude_code_runner
    usa_output_anterior: true
    params:
      modo: "review"
      mcp_config_path: "./config/mcp-docusaurus.json"
      skill: "code-review"
    retry:
      max_attempts: 1
