# Template de workflow (ADR-008): "Implementar (repositório local, PR pela CI do
# próprio repo)" — roda o Claude Code em modo `coding_local` contra um repositório
# local já existente (sem clonar, sem branch criada pelo motor) e confirma que a
# PR abriu via `git_pr` (`action: confirm_pr`) — nunca abre a PR ele mesmo, quem
# abre é a CI já configurada no repositório-alvo (ver ADR-008, Contexto, para o
# exemplo real verificado em `ai-lup-poc-target-cli`).
#
# Este arquivo é, ao mesmo tempo, (a) um chain config válido — `name`/`steps`
# são carregados sem modificação por YamlJsonChainLoader — e (b) um descritor
# de template: `id`/`label`/`description`/`params_schema` são lidos só por
# FileSystemWorkflowTemplateRegistry e ignorados pelo chain loader. `vars:` não
# é declarado aqui — é preenchido em runtime a partir dos `params` submetidos
# (ver application/workflow_templates.py::materialize_chain_raw).

id: claude-implementar-local
label: "Implementar (repositório local, PR pela CI do próprio repo)"
description: >-
  Roda o Claude Code em modo coding contra um repositório local já existente,
  seguindo o fluxo de Git documentado nesse repositório (branch + push) — não
  clona, não cria branch pelo motor, e não abre PR pelo motor: quem abre é a
  CI do próprio repositório-alvo. O motor só confirma que a PR abriu.
params_schema:
  - name: repo_path
    label: "Repositório local"
    type: select
    required: true
    source: local_repos
  - name: prompt
    label: "O que implementar"
    type: textarea
    required: true
  - name: docs_referenced
    label: "Knowledge Bases"
    type: multiselect
    required: false
    source: spec_multiselect

name: claude-implementar-local
steps:
  - name: implementar
    plugin: claude_code_runner
    usa_output_anterior: false
    params:
      modo: "coding_local"
      mcp_config_path: "./config/mcp-docs-proxy.json"
      workspace_path: "{{ vars.repo_path }}"
      prompt: "{{ vars.prompt }}"
      docs_referenced: "{{ vars.docs_referenced }}"
    retry:
      max_attempts: 1

  - name: confirmar_pr
    plugin: git_pr
    usa_output_anterior: true
    params:
      action: "confirm_pr"
    retry:
      max_attempts: 5
      initial_delay: 30.0
      multiplier: 1.5
